<!doctype html>

    <style>
      .not-found {
        width: min(1180px, calc(100% - 2.5rem));
        margin: 0 auto;
        padding: clamp(4rem, 10vw, 8rem) 0 clamp(3rem, 8vw, 6rem);
        text-align: center;
      }
      .not-found-code {
        margin: 0;
        color: var(--blue-deep);
        font: 700 clamp(4.5rem, 14vw, 8rem) / 1 var(--serif, Georgia, serif);
        letter-spacing: -0.05em;
        text-shadow: 4px 4px 0 var(--blue);
      }
      .not-found h1 {
        margin: 0.6rem 0 0;
        font: 700 1.6rem var(--serif, Georgia, serif);
        letter-spacing: -0.02em;
      }
      .not-found p:not(.not-found-code) {
        margin: 0.7rem auto 1.8rem;
        max-width: 30rem;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.7;
      }
      .not-found .primary-button {
        display: inline-flex;
        align-items: center;
        min-height: 2.9rem;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <a class="brand" href="/" aria-label="返回 VC歌词分享网首页">

      <p>

      </p>
      <p class="site-version">版本 <span data-site-version><!-- SITE_VERSION --></span></p>
    </footer>

    <script>
      (() => {
        const target = document.querySelector("#dmca-email");
        if (!target) return;
        const email = `${target.dataset.user}@${target.dataset.domain}`;
        const anchor = document.createElement("a");
        anchor.href = `mailto:${email}`;
        anchor.textContent = email;
        target.replaceChildren(anchor);
      })();
    </script>
